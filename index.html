<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Quản lý Công việc & Trực quan hóa Git Reset/Revert</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">Session 04 - Exercise 5</div>
      <h1>TaskFlow Manager</h1>
      <p class="subtitle">Ứng dụng quản lý công việc và demo bài thực hành Git Reset vs Revert</p>
    </header>

    <main class="main-card">
      <section class="action-bar">
        <div class="input-group">
          <input type="text" id="taskInput" placeholder="Nhập tên nhiệm vụ mới..." autocomplete="off">
          <select id="prioritySelect">
            <option value="low">Thấp</option>
            <option value="medium" selected>Trung bình</option>
            <option value="high">Cao</option>
          </select>
          <button id="addBtn" class="btn btn-primary">Thêm nhiệm vụ</button>
        </div>

        <div class="filter-group">
          <input type="text" id="searchInput" placeholder="Tìm kiếm công việc...">
          <select id="filterStatus">
            <option value="all">Tất cả trạng thái</option>
            <option value="pending">Đang làm</option>
            <option value="completed">Đã hoàn thành</option>
          </select>
          <button id="sortBtn" class="btn btn-secondary">Sắp xếp: Mới nhất</button>
        </div>
      </section>

      <section class="task-stats">
        <div class="stat-card">
          <span class="stat-num" id="totalTasks">0</span>
          <span class="stat-label">Tổng nhiệm vụ</span>
        </div>
        <div class="stat-card">
          <span class="stat-num text-warning" id="pendingTasks">0</span>
          <span class="stat-label">Chưa xong</span>
        </div>
        <div class="stat-card">
          <span class="stat-num text-success" id="completedTasks">0</span>
          <span class="stat-label">Đã xong</span>
        </div>
      </section>

      <ul id="taskList" class="task-list"></ul>
    </main>

    <footer class="footer">
      <p>Thực hành DevOps / Git Version Control - Git Reset vs Git Revert</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
